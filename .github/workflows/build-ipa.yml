name: Build unsigned JustSend IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

concurrency:
  group: justsend-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA (macOS runner)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install Rust + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install cbindgen & xcodegen
        run: |
          brew install cbindgen xcodegen

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustCore -> RustCore/target

      - name: Build Rust core (device)
        run: |
          CARGO_BUILD_JOBS=2 cargo build --release \
            --manifest-path RustCore/Cargo.toml -p justsend-ffi \
            --target aarch64-apple-ios
          mkdir -p App/Libraries/iphoneos
          cp RustCore/target/aarch64-apple-ios/release/libjustsend.a App/Libraries/iphoneos/

      - name: Build Rust core (simulator, universal)
        run: |
          CARGO_BUILD_JOBS=2 cargo build --release \
            --manifest-path RustCore/Cargo.toml -p justsend-ffi \
            --target aarch64-apple-ios-sim
          CARGO_BUILD_JOBS=2 cargo build --release \
            --manifest-path RustCore/Cargo.toml -p justsend-ffi \
            --target x86_64-apple-ios
          mkdir -p App/Libraries/iphonesimulator
          lipo -create \
            RustCore/target/aarch64-apple-ios-sim/release/libjustsend.a \
            RustCore/target/x86_64-apple-ios/release/libjustsend.a \
            -output App/Libraries/iphonesimulator/libjustsend.a

      - name: Generate bridging header
        run: |
          cd RustCore
          cbindgen --config cbindgen.toml --crate justsend-ffi \
            --output ../App/JustSend-Bridging-Header.h

      - name: Rust unit tests
        run: cargo test --manifest-path RustCore/Cargo.toml -p justsend-core

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          xcodebuild -project JustSend.xcodeproj -scheme JustSend \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -quiet build

      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/JustSend.app out/Payload/
          cd out && zip -qry JustSend-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JustSend-unsigned-IPA
          path: out/JustSend-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Build simulator slice ( sanity )
        continue-on-error: true
        run: |
          xcodebuild -project JustSend.xcodeproj -scheme JustSend \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO -quiet build
