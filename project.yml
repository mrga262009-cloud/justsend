name: JustSend
options:
  bundleIdPrefix: com.justsend
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.justsend.app
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.10
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"
      SWIFT_COMPILATION_MODE: wholemodule

packages: {}

targets:
  JustSend:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - JustSend-Bridging-Header.h
          - Assets.xcassets
          - LaunchScreen.storyboard
          - Libraries
      - path: Sources
    resources:
      - path: Sources/Resources
      - path: App/Assets.xcassets
      - path: App/LaunchScreen.storyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JustSend
        CFBundleName: JustSend
        CFBundleURLTypes:
          - CFBundleURLName: com.justsend.app
            CFBundleURLSchemes: [justsend]
        NSCameraUsageDescription: "JustSend uses the camera to take photos and 60-second videos to share with friends."
        NSMicrophoneUsageDescription: "JustSend uses the microphone to record video with sound."
        NSPhotoLibraryUsageDescription: "JustSend needs photo library access to pick and save your photos."
        NSPhotoLibraryAddUsageDescription: "JustSave photos to your library."
        NSContactsUsageDescription: "Find friends from your contacts."
        NSLocationWhenInUseUsageDescription: "Share your location with friends."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justsend.app
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/JustSend-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) JUSTSEND_NATIVE"
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/App/Libraries/$(PLATFORM_NAME)"
        OTHER_LDFLAGS:
          - "-ljustsend"
          - "-lc++"
          - "-lz"
